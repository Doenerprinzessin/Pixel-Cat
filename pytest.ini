[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers --import-mode=importlib
timeout = 120
qt_api = pyside6
markers =
    windows: needs real Windows (Win32, UIA, DPAPI, registry); skipped elsewhere
    macos: needs real macOS (read-only pyobjc calls, never prompts); skipped elsewhere
    macos_live: drives the real Mac (mouse, keys, volume, Keychain, LaunchAgents) and cleans up; only with PIXELCAT_MACOS_LIVE=1 on macOS
    qt: needs a QApplication (use the pytest-qt qapp/qtbot fixtures)
filterwarnings =
    ignore::DeprecationWarning:PySide6.*
