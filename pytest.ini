[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers --import-mode=importlib
timeout = 120
qt_api = pyside6
markers =
    windows: needs real Windows (Win32, UIA, DPAPI, registry); skipped elsewhere
    qt: needs a QApplication (use the pytest-qt qapp/qtbot fixtures)
filterwarnings =
    ignore::DeprecationWarning:PySide6.*
